[package]
name = "consul"
version = "0.1.0"
authors = ["chris0lsen <chris@chrisolsen.net>", "ircjwin <christopherjamesirwin@gmail.com>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"

[build-dependencies]
slint-build = "1.6"
